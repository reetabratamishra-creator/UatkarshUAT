<template>
    <lightning-card class="upload-card">

        <div class="header">
            <div class="header-content">
                <lightning-icon
                    icon-name="utility:file"
                    size="large"
                    class="header-icon">
                </lightning-icon>

                <div>
                    <h1>OCR Document Processing</h1>
                    <p>Upload tender documents for AI analysis</p>
                </div>
            </div>
        </div>

        <div class="container">

            <div class="upload-section">

                <lightning-file-upload
                    label="Upload Documents"
                    name="fileUploader"
                    multiple
                    accept={acceptedFormats}
                    record-id={recordId}
                    onuploadfinished={handleUploadFinished}>
                </lightning-file-upload>

            </div>

            <template if:true={uploadedFiles.length}>
                <div class="file-summary">

                    <div class="summary-header">
                        <span>Uploaded Files</span>

                        <lightning-badge
                            label={uploadedFileCount}>
                        </lightning-badge>
                    </div>

                    <template
                        for:each={uploadedFiles}
                        for:item="file">

                        <div
                            key={file.documentId}
                            class="file-row">

                            <lightning-icon
                                icon-name="doctype:attachment"
                                size="small">
                            </lightning-icon>

                            <span>{file.name}</span>

                        </div>

                    </template>

                </div>
            </template>

            <div class="action-section">

                <lightning-button
                    variant="brand"
                    label="Start OCR Analysis"
                    onclick={handleSubmit}
                    disabled={isDisabled}>
                </lightning-button>

            </div>

        </div>

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Processing"
                size="medium">
            </lightning-spinner>
        </template>

    </lightning-card>
</template>
