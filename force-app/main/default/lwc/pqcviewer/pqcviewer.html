<template>
    <lightning-card title="PQC Analysis" icon-name="standard:report">
        <div slot="actions">
            <lightning-button-group>
                <lightning-button
                    label="Download PDF"
                    icon-name="utility:download"
                    onclick={handleDownloadPdf}>
                </lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-p-around_medium">

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading PQC data" size="medium"></lightning-spinner>
            </template>

            <template lwc:elseif={hasError}>
                <div class="error-msg">{pqcResult.errorMessage}</div>
            </template>

            <template lwc:elseif={hasItems}>

                <!-- Summary badges -->
                <div class="summary-bar">
                    <span class="summary-pill pill-found">Found: {foundCount}</span>
                    <span class="summary-pill pill-partial">Partial: {partialCount}</span>
                    <span class="summary-pill pill-notfound">Not Found: {notFoundCount}</span>
                    <span class="summary-pill pill-total">Total: {totalCount}</span>
                </div>

                <!-- Scrollable table -->
                <div class="table-container">
                    <table class="pqc-table">
                        <thead>
                            <tr>
                                <th class="col-item">PQC Item</th>
                                <th class="col-findings">Findings</th>
                                <th class="col-page">Page Ref</th>
                                <th class="col-status">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={items} for:item="item">
                                <tr key={item.key}>
                                    <td class="col-item"><strong>{item.pqcLabel}</strong></td>
                                    <td class="col-findings">{item.findings}</td>
                                    <td class="col-page">{item.pageReference}</td>
                                    <td class="col-status">
                                        <span class={item.badgeClass}>{item.status}</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

            </template>

            <template lwc:else>
                <div class="empty-msg">No PQC data available yet for this record.</div>
            </template>

        </div>
    </lightning-card>
</template>
