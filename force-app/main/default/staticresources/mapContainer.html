<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { height: 100%; width: 100%; overflow: hidden; }

        /* ── Popup Card ────────────────────────────────────────────── */
        .visit-popup {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-width: 200px;
        }
        .visit-popup-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .visit-popup-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #F59E0B;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .visit-popup-client {
            font-size: 13px;
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.3;
        }
        .visit-popup-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }
        .visit-popup-row svg {
            flex-shrink: 0;
            opacity: 0.6;
        }
        .visit-popup-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 6px;
        }
        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-done   { background: #E5E7EB; color: #374151; }

        /* ── Mapbox overrides ──────────────────────────────────────── */
        .mapboxgl-popup-content {
            border-radius: 12px !important;
            padding: 12px 14px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18) !important;
        }
        .mapboxgl-popup-tip { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        let map;
        let currentProvider = null; // 'google' | 'mapbox'
        let mainMarkers = [];
        let timelineMarkers = [];
        let directionsRenderer;
        let directionsService;
        let polyline;
        let mapboxMarkers = [];
        let mapboxPathSource = null;
        let animFrame = null;

        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.type === 'INIT_GOOGLE') {
                currentProvider = 'google';
                initGoogleMap(data.apiKey, data.center);
            } else if (data.type === 'INIT_MAPBOX') {
                currentProvider = 'mapbox';
                initMapboxMap(data.accessToken, data.center);
            } else if (data.type === 'PLOT_MARKERS') {
                if (currentProvider === 'google') plotGoogleMarkers(data.markers);
                else if (currentProvider === 'mapbox') plotMapboxMarkers(data.markers);
            } else if (data.type === 'DRAW_PATH') {
                if (currentProvider === 'google') drawGooglePath(data.path, data.visitNodes || []);
                else if (currentProvider === 'mapbox') drawMapboxPath(data.path, data.visitNodes || []);
            }
        });

        /* ═══════════════════════════════════════════════════════════
           GOOGLE MAPS
           ═══════════════════════════════════════════════════════════ */
        function initGoogleMap(apiKey, center) {
            document.getElementById('map').innerHTML = '';
            if (window.google && window.google.maps) {
                renderGoogleMap(center);
                return;
            }
            const script = document.createElement('script');
            script.src = 'https://maps.googleapis.com/maps/api/js?key=' + apiKey + '&v=weekly&loading=async&callback=_initGoogleCb';
            script.async = true;
            window._initGoogleCb = function() { renderGoogleMap(center); };
            document.head.appendChild(script);
        }

        function renderGoogleMap(center) {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: center.lat, lng: center.lng },
                zoom: 13,
                mapTypeId: 'roadmap',
                disableDefaultUI: true,
                styles: [
                    { elementType: 'geometry', stylers: [{ color: '#1a1a2e' }] },
                    { elementType: 'labels.text.fill', stylers: [{ color: '#8ec3b0' }] },
                    { elementType: 'labels.text.stroke', stylers: [{ color: '#1a3c4a' }] },
                    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#16213e' }] },
                    { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#212a37' }] },
                    { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#9ca5b3' }] },
                    { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#0f3460' }] },
                    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0e1b4d' }] },
                    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
                    { featureType: 'transit', stylers: [{ visibility: 'off' }] }
                ]
            });
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true,
                polylineOptions: { strokeColor: '#F59E0B', strokeOpacity: 0.85, strokeWeight: 4 }
            });
            window.parent.postMessage({ type: 'MAP_READY' }, '*');
        }

        function plotGoogleMarkers(markerData) {
            if (!map) return;
            mainMarkers.forEach(m => m.setMap(null));
            mainMarkers = [];
            if (!markerData) return;
            markerData.forEach(m => {
                const marker = new google.maps.Marker({
                    position: { lat: Number(m.location.Latitude), lng: Number(m.location.Longitude) },
                    map: map,
                    title: m.title,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 6,
                        fillColor: '#3B82F6',
                        fillOpacity: 1,
                        strokeColor: '#fff',
                        strokeWeight: 2
                    }
                });
                mainMarkers.push(marker);
            });
        }

        function drawGooglePath(pathCoordinates, visitNodes) {
            if (!map) return;
            if (directionsRenderer) directionsRenderer.setDirections({ routes: [] });
            if (polyline) polyline.setMap(null);
            timelineMarkers.forEach(m => m.setMap(null));
            timelineMarkers = [];

            const hasPath = pathCoordinates && pathCoordinates.length > 0;
            const hasVisits = visitNodes && visitNodes.length > 0;
            if (!hasPath && !hasVisits) return;

            // Draw track polyline only (visits are markers, not path vertices)
            if (hasPath && pathCoordinates.length >= 2) {
                polyline = new google.maps.Polyline({
                    path: pathCoordinates,
                    geodesic: true,
                    strokeColor: '#F59E0B',
                    strokeOpacity: 0.9,
                    strokeWeight: 4,
                    map: map
                });
            }

            const bounds = new google.maps.LatLngBounds();
            if (hasPath) {
                pathCoordinates.forEach(c => bounds.extend(c));
                addGooglePinMarker(pathCoordinates[0], '#10B981', 'S', 'Shift Start');
                if (pathCoordinates.length > 1) {
                    addGooglePinMarker(pathCoordinates[pathCoordinates.length - 1], '#EF4444', 'E', 'Shift End');
                }
            }
            if (hasVisits) {
                visitNodes.forEach(vn => {
                    bounds.extend({ lat: vn.latitude, lng: vn.longitude });
                    addGoogleVisitMarker(vn);
                });
            }

            if (hasPath || hasVisits) {
                if ((hasPath ? pathCoordinates.length : 0) + (hasVisits ? visitNodes.length : 0) === 1) {
                    const only = hasPath
                        ? pathCoordinates[0]
                        : { lat: visitNodes[0].latitude, lng: visitNodes[0].longitude };
                    map.setCenter(only);
                    map.setZoom(15);
                } else {
                    map.fitBounds(bounds, { padding: 60 });
                }
            }
        }

        function addGooglePinMarker(pt, color, label, title) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">
                <path d="M16 0C9.37 0 4 5.37 4 12c0 9.5 12 30 12 30s12-20.5 12-30C28 5.37 22.63 0 16 0z" fill="${color}" stroke="#fff" stroke-width="2"/>
                <circle cx="16" cy="12" r="7" fill="rgba(255,255,255,0.25)"/>
                <text x="16" y="17" font-family="Arial" font-size="9" font-weight="bold" fill="white" text-anchor="middle">${label}</text>
            </svg>`;
            const marker = new google.maps.Marker({
                position: pt,
                map: map,
                title: title,
                icon: {
                    url: 'data:image/svg+xml;base64,' + btoa(svg),
                    anchor: new google.maps.Point(16, 42),
                    scaledSize: new google.maps.Size(32, 42)
                }
            });
            timelineMarkers.push(marker);
        }

        function addGoogleVisitMarker(vn) {
            const color = vn.isActive ? '#F59E0B' : '#D97706';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
                <circle cx="15" cy="15" r="13" fill="${color}" stroke="#fff" stroke-width="2.5"/>
                <text x="15" y="20" font-family="Arial" font-size="${vn.nodeNumber > 9 ? 9 : 11}" font-weight="bold" fill="white" text-anchor="middle">${vn.nodeNumber}</text>
            </svg>`;
            const infoContent = `<div style="font-family:-apple-system,sans-serif;min-width:180px;padding:4px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                    <div style="width:22px;height:22px;border-radius:50%;background:${color};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${vn.nodeNumber}</div>
                    <b style="font-size:13px;color:#1a1a2e">${vn.clientName || 'Visit'}</b>
                </div>
                <div style="font-size:11px;color:#555;margin:3px 0">🕐 Check-In: <b>${vn.checkInTime || 'N/A'}</b></div>
                ${vn.checkOutTime ? '<div style="font-size:11px;color:#555;margin:3px 0">🏁 Check-Out: <b>' + vn.checkOutTime + '</b></div>' : ''}
                ${vn.visitDuration ? '<div style="font-size:11px;color:#555;margin:3px 0">⏱ Duration: <b>' + vn.visitDuration + '</b></div>' : ''}
                ${vn.visitCategory ? '<div style="font-size:11px;color:#555;margin:3px 0">📍 ' + vn.visitCategory + '</div>' : ''}
                <span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;margin-top:6px;background:${vn.isActive ? '#D1FAE5' : '#E5E7EB'};color:${vn.isActive ? '#065F46' : '#374151'}">${vn.isActive ? 'Active' : 'Completed'}</span>
            </div>`;
            const infoWindow = new google.maps.InfoWindow({ content: infoContent, maxWidth: 240 });
            const marker = new google.maps.Marker({
                position: { lat: vn.latitude, lng: vn.longitude },
                map: map,
                title: 'Visit ' + vn.nodeNumber + ': ' + (vn.clientName || ''),
                icon: {
                    url: 'data:image/svg+xml;base64,' + btoa(svg),
                    anchor: new google.maps.Point(15, 15),
                    scaledSize: new google.maps.Size(30, 30)
                }
            });
            marker.addListener('click', () => {
                timelineMarkers.forEach(m => { if (m._infoWindow) m._infoWindow.close(); });
                infoWindow.open(map, marker);
            });
            marker._infoWindow = infoWindow;
            timelineMarkers.push(marker);
        }

        /* ═══════════════════════════════════════════════════════════
           MAPBOX GL JS  (Primary — Unolo dark style)
           ═══════════════════════════════════════════════════════════ */
        function initMapboxMap(accessToken, center) {
            document.getElementById('map').innerHTML = '';
            if (window.mapboxgl) {
                renderMapboxMap(accessToken, center);
                return;
            }
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css';
            document.head.appendChild(css);

            const script = document.createElement('script');
            script.src = 'https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js';
            script.onload = function() { renderMapboxMap(accessToken, center); };
            script.onerror = function() { console.error('Failed to load Mapbox GL JS'); };
            document.head.appendChild(script);
        }

        function renderMapboxMap(accessToken, center) {
            mapboxgl.accessToken = accessToken;
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [center.lng, center.lat],
                zoom: 12,
                attributionControl: false
            });
            map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
            map.on('load', function() {
                window.parent.postMessage({ type: 'MAP_READY' }, '*');
            });
        }

        function plotMapboxMarkers(markerData) {
            if (!map || currentProvider !== 'mapbox') return;
            mapboxMarkers.forEach(m => m.remove());
            mapboxMarkers = [];
            if (!markerData) return;
            markerData.forEach(m => {
                const el = document.createElement('div');
                el.style.cssText = 'width:12px;height:12px;border-radius:50%;background:#3B82F6;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);cursor:pointer;';
                const popup = new mapboxgl.Popup({ offset: 14, closeButton: false })
                    .setHTML('<b style="font-size:12px;color:#1a1a2e">' + (m.title || '') + '</b>' +
                             '<p style="margin:4px 0 0;font-size:11px;color:#666;">' + (m.description || '') + '</p>');
                const marker = new mapboxgl.Marker(el)
                    .setLngLat([Number(m.location.Longitude), Number(m.location.Latitude)])
                    .setPopup(popup)
                    .addTo(map);
                mapboxMarkers.push(marker);
            });
        }

        function drawMapboxPath(pathCoordinates, visitNodes) {
            if (!map || currentProvider !== 'mapbox') return;

            // Clear old markers and animation
            timelineMarkers.forEach(m => { if (m && m.remove) m.remove(); });
            timelineMarkers = [];
            if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }

            // Remove old path layers/sources
            ['path-glow', 'path-line', 'path-dashes'].forEach(id => {
                if (map.getLayer(id)) map.removeLayer(id);
            });
            if (map.getSource('path-source')) map.removeSource('path-source');

            const hasPath = pathCoordinates && pathCoordinates.length > 0;
            const hasVisits = visitNodes && visitNodes.length > 0;
            if (!hasPath && !hasVisits) return;

            // ── Start / End markers from track path only ───────────
            if (hasPath) {
                const startPt = pathCoordinates[0];
                const startEl = buildPinElement('#10B981', 'S');
                const startPopup = new mapboxgl.Popup({ offset: 16, closeButton: false })
                    .setHTML('<b style="font-size:12px">🟢 Shift Start</b>');
                const startMarker = new mapboxgl.Marker(startEl)
                    .setLngLat([startPt.lng, startPt.lat])
                    .setPopup(startPopup)
                    .addTo(map);
                timelineMarkers.push(startMarker);

                if (pathCoordinates.length > 1) {
                    const endPt = pathCoordinates[pathCoordinates.length - 1];
                    const endEl = buildPinElement('#EF4444', 'E');
                    const endPopup = new mapboxgl.Popup({ offset: 16, closeButton: false })
                        .setHTML('<b style="font-size:12px">🔴 Shift End</b>');
                    const endMarker = new mapboxgl.Marker(endEl)
                        .setLngLat([endPt.lng, endPt.lat])
                        .setPopup(endPopup)
                        .addTo(map);
                    timelineMarkers.push(endMarker);
                }
            }

            // ── Numbered visit node markers (not part of polyline) ─
            if (hasVisits) {
                visitNodes.forEach(vn => {
                    const vnEl = buildVisitNodeElement(vn.nodeNumber, vn.isActive);
                    const popup = new mapboxgl.Popup({
                        offset: 18,
                        closeButton: false,
                        maxWidth: '240px',
                        className: 'unolo-popup'
                    }).setHTML(buildVisitPopupHtml(vn));
                    const vnMarker = new mapboxgl.Marker(vnEl)
                        .setLngLat([vn.longitude, vn.latitude])
                        .setPopup(popup)
                        .addTo(map);
                    timelineMarkers.push(vnMarker);
                });
            }

            if (!hasPath || pathCoordinates.length < 2) {
                if (hasPath) {
                    map.flyTo({ center: [pathCoordinates[0].lng, pathCoordinates[0].lat], zoom: 15 });
                } else if (hasVisits) {
                    const bounds = new mapboxgl.LngLatBounds();
                    visitNodes.forEach(v => bounds.extend([v.longitude, v.latitude]));
                    map.fitBounds(bounds, { padding: 60, maxZoom: 15 });
                }
                return;
            }

            // ── Polyline path ──────────────────────────────────────
            const coords = pathCoordinates.map(p => [p.lng, p.lat]);
            map.addSource('path-source', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }
            });

            // Glow layer (blurred thick line)
            map.addLayer({
                id: 'path-glow',
                type: 'line',
                source: 'path-source',
                paint: {
                    'line-color': '#F59E0B',
                    'line-width': 10,
                    'line-opacity': 0.15,
                    'line-blur': 4
                }
            });

            // Solid base line
            map.addLayer({
                id: 'path-line',
                type: 'line',
                source: 'path-source',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: { 'line-color': '#F59E0B', 'line-width': 3.5, 'line-opacity': 0.9 }
            });

            // Animated dashes overlay
            map.addLayer({
                id: 'path-dashes',
                type: 'line',
                source: 'path-source',
                layout: { 'line-cap': 'butt', 'line-join': 'round' },
                paint: {
                    'line-color': '#FFFFFF',
                    'line-width': 2,
                    'line-opacity': 0.6,
                    'line-dasharray': [0, 4, 3]
                }
            });

            // Animate dash offset
            const dashArraySequence = [
                [0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5],
                [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0], [0, 0.5, 3, 3.5],
                [0, 1, 3, 3], [0, 1.5, 3, 2.5], [0, 2, 3, 2],
                [0, 2.5, 3, 1.5], [0, 3, 3, 1], [0, 3.5, 3, 0.5]
            ];
            let step = 0;
            function animateDash(timestamp) {
                const dashStep = Math.floor(timestamp / 70) % dashArraySequence.length;
                if (dashStep !== step) {
                    map.setPaintProperty('path-dashes', 'line-dasharray', dashArraySequence[dashStep]);
                    step = dashStep;
                }
                animFrame = requestAnimationFrame(animateDash);
            }
            animFrame = requestAnimationFrame(animateDash);

            // ── Fit bounds ─────────────────────────────────────────
            const bounds = new mapboxgl.LngLatBounds();
            coords.forEach(c => bounds.extend(c));
            if (visitNodes && visitNodes.length > 0) {
                visitNodes.forEach(v => bounds.extend([v.longitude, v.latitude]));
            }
            map.fitBounds(bounds, { padding: { top: 70, bottom: 70, left: 60, right: 60 } });
        }

        /* ── Helper: build pin SVG element ──────────────────────── */
        function buildPinElement(color, label) {
            const el = document.createElement('div');
            el.style.cssText = 'cursor:pointer;';
            el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="38" viewBox="0 0 28 38">
                <filter id="drop-shadow">
                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/>
                </filter>
                <path d="M14 0C8.48 0 4 4.48 4 10c0 7.5 10 28 10 28s10-20.5 10-28C24 4.48 19.52 0 14 0z"
                      fill="${color}" filter="url(#drop-shadow)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
                <circle cx="14" cy="10" r="6" fill="rgba(255,255,255,0.2)"/>
                <text x="14" y="14.5" font-family="Arial,sans-serif" font-size="8" font-weight="bold"
                      fill="white" text-anchor="middle">${label}</text>
            </svg>`;
            return el;
        }

        /* ── Helper: build numbered visit node element ───────────── */
        function buildVisitNodeElement(num, isActive) {
            const color = isActive ? '#F59E0B' : '#D97706';
            const el = document.createElement('div');
            el.style.cssText = 'cursor:pointer;transition:transform 0.15s ease;';
            el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                <filter id="vs">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.5)"/>
                </filter>
                <circle cx="16" cy="16" r="14" fill="${color}" filter="url(#vs)" stroke="white" stroke-width="2.5"/>
                <circle cx="16" cy="16" r="10" fill="rgba(255,255,255,0.12)"/>
                <text x="16" y="21" font-family="Arial,sans-serif" font-size="${num > 9 ? 9 : 11}"
                      font-weight="bold" fill="white" text-anchor="middle">${num}</text>
            </svg>`;
            el.onmouseover = () => { el.style.transform = 'scale(1.2)'; };
            el.onmouseout  = () => { el.style.transform = 'scale(1)'; };
            return el;
        }

        /* ── Helper: build visit popup HTML ─────────────────────── */
        function buildVisitPopupHtml(vn) {
            const color = vn.isActive ? '#F59E0B' : '#D97706';
            const badgeHtml = vn.isActive
                ? '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;background:#D1FAE5;color:#065F46">Active</span>'
                : '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;background:#F3F4F6;color:#374151">Completed</span>';
            return `<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-width:190px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                    <div style="width:24px;height:24px;border-radius:50%;background:${color};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${vn.nodeNumber}</div>
                    <b style="font-size:13px;color:#1a1a2e;line-height:1.3">${vn.clientName || 'Visit'}</b>
                </div>
                <div style="font-size:11px;color:#555;margin:3px 0">🕐 Check-In: <b>${vn.checkInTime || 'N/A'}</b></div>
                ${vn.checkOutTime && vn.checkOutTime !== 'Active' ? '<div style="font-size:11px;color:#555;margin:3px 0">🏁 Check-Out: <b>' + vn.checkOutTime + '</b></div>' : ''}
                ${vn.visitDuration ? '<div style="font-size:11px;color:#555;margin:3px 0">⏱ Duration: <b>' + vn.visitDuration + '</b></div>' : ''}
                ${vn.visitCategory ? '<div style="font-size:11px;color:#555;margin:3px 0">📁 ' + vn.visitCategory + '</div>' : ''}
                <div style="margin-top:7px">${badgeHtml}</div>
            </div>`;
        }
    </script>
</body>
</html>
